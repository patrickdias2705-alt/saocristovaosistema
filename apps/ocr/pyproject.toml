[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sao-cristovao-ocr"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["main", "parser", "providers"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
exclude = [".venv", ".vercel"]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python build.py"
