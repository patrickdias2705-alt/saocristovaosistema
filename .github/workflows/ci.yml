name: CI
on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/ocr/requirements.txt
            apps/ocr/requirements-dev.txt
      - run: python -m pip install -r apps/ocr/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: apps/ocr
        env:
          OCR_SKIP_PRELOAD: 'true'
      - run: python -m ruff check . --exclude .venv
        working-directory: apps/ocr
      - run: python -m pip check
